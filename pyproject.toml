[project]
name = "vault-mcp"
version = "0.1.0"
description = "Read-only remote MCP server over Peter's Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
