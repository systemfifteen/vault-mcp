# Coolify (build pack: Docker Compose). The vault is mounted READ-ONLY; secrets come from Coolify runtime env.
services:
  vault-mcp:
    build: .
    expose:
      - "8000"
    volumes:
      - /home/fifteen/obsidian-sync/vaults/peter/Fifteen:/vault:ro
    environment:
      - MCP_TOKEN=${MCP_TOKEN:-}
      - VAULT_DIR=/vault
      - VAULT_EXCLUDE=${VAULT_EXCLUDE:-Medrio}
      - PUBLIC_HOST=${PUBLIC_HOST:-vault.system15.win}
      - TZ=Europe/Bratislava
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      # Traefik must not log the request path: claude.ai sends the token in the URL (/mcp/<token>).
      # Router names as generated by Coolify for app udxsckirwomhpouovfgfnx52, service vault-mcp.
      - traefik.http.routers.http-0-udxsckirwomhpouovfgfnx52-vault-mcp-6d74.observability.accesslogs=false
      - traefik.http.routers.https-0-udxsckirwomhpouovfgfnx52-vault-mcp-6d74.observability.accesslogs=false
    restart: unless-stopped
